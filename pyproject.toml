[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-signal-lab"
version = "0.1.0"
description = "Reproducible experiments for Korean cultural trend signals"
requires-python = ">=3.12"
dependencies = [
    "kiwipiepy==0.23.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
